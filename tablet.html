<style>
  * { box-sizing:border-box; -webkit-tap-highlight-color:transparent; user-select:none; }
  html,body { margin:0; height:100%; overflow:hidden; font-family:-apple-system,BlinkMacSystemFont,'Segoe UI',sans-serif; background:#12151a; color:#eef1f5; }

</div>

<script>
const SUPABASE_URL = 'https://ppmiwnploqjbhaqdkrxr.supabase.co';
const SUPABASE_KEY = 'eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6InBwbWl3bnBsb3FqYmhhcWRrcnhyIiwicm9sZSI6ImFub24iLCJpYXQiOjE3NzcyODYyNTgsImV4cCI6MjA5Mjg2MjI1OH0.jqQ1qGXaIC2pJC5CG8RCcT3PYMOZvL7pdIWpLqILXl8';
const { createClient } = supabase;
const sb = createClient(SUPABASE_URL, SUPABASE_KEY);

const PALETTE_BG = ['#5aa9ff','#4ecb9f','#f0a35a','#c893f0','#f07a9b','#7fd15a'];

let selectedPerson = null;   // { name, email, authType }
let me = null;               // profilo completo dopo login (role, ecc.)
let vehicles = [];
let pinBuffer = '';
let idleTimer = null;
let prenotaVeh = null;
let prenotaDurMs = null;
let returnCandidates = [];

function fmtClock(){ document.getElementById('clock').textContent = new Date().toLocaleTimeString('it-IT',{hour:'2-digit',minute:'2-digit'}); }
setInterval(fmtClock,1000); fmtClock();

function showScreen(id){
  document.querySelectorAll('.screen').forEach(s=>s.classList.remove('active'));
  document.getElementById(id).classList.add('active');
  resetIdle();
}
function resetIdle(){
  clearTimeout(idleTimer);
  idleTimer = setTimeout(()=>{ logoutKiosk(); }, 25000);
}
document.addEventListener('click', resetIdle);
document.addEventListener('touchstart', resetIdle);

function fmtDate(d){ return d.toISOString().slice(0,10); }

// ── Caricamento nomi ──────────────────────────────
let kioskUsers = [];
async function loadNames(){
  const res = await fetch(`${SUPABASE_URL}/functions/v1/kiosk-names`, { headers:{ apikey: SUPABASE_KEY }});
  const json = await res.json();
  kioskUsers = json.users || [];
  const grid = document.getElementById('names-grid');
  if (!kioskUsers.length){ grid.innerHTML = '<div style="color:#8a92a3">Nessun utente configurato</div>'; return; }
  grid.innerHTML = kioskUsers.map((u,i)=>{
    const initials = u.name.split(' ').map(n=>n[0]).join('').substring(0,2).toUpperCase();
    const bg = PALETTE_BG[i % PALETTE_BG.length];
    return `<div class="tile" onclick="selectPersonByIndex(${i})">
      <div class="av" style="background:${bg}">${initials}</div>
      <div class="nm">${u.name}</div>
    </div>`;
  }).join('');
}
function selectPersonByIndex(i){ selectPerson(kioskUsers[i]); }

function selectPerson(u){
  selectedPerson = u;
  document.getElementById('auth-greet').textContent = 'Ciao ' + u.name.split(' ')[0];
  document.getElementById('auth-pin-area').style.display = u.authType==='pin' ? 'flex' : 'none';
  document.getElementById('auth-pw-area').style.display  = u.authType==='pin' ? 'none' : 'flex';
  if (u.authType==='pin'){ pinBuffer=''; renderPinPad(); updatePinDots(); document.getElementById('pin-err').textContent=''; }
  else { document.getElementById('pw-input').value=''; document.getElementById('pw-err').textContent=''; }
  showScreen('screen-auth');
}

function goNames(){ selectedPerson=null; me=null; showScreen('screen-names'); }

function renderPinPad(){
  const keys = ['1','2','3','4','5','6','7','8','9','','0','⌫'];
  document.getElementById('pin-pad').innerHTML = keys.map(k=>{
    if (k==='') return '<div></div>';
    return `<button class="pin-key" onclick="pinPress('${k}')">${k}</button>`;
  }).join('');
}
function updatePinDots(){
  document.getElementById('pin-dots').innerHTML = Array.from({length:5}).map((_,i)=>
    `<div class="pin-dot ${i < pinBuffer.length ? 'filled':''}"></div>`).join('');
}
async function pinPress(k){
  if (k==='⌫'){ pinBuffer = pinBuffer.slice(0,-1); updatePinDots(); return; }
  if (pinBuffer.length>=5) return;
  pinBuffer += k;
  updatePinDots();
  if (pinBuffer.length===5) await doPinLogin();
}
async function doPinLogin(){
  const err = document.getElementById('pin-err');
  const res = await fetch(`${SUPABASE_URL}/functions/v1/pin-login`, {
    method:'POST', headers:{ apikey: SUPABASE_KEY, 'Content-Type':'application/json' },
    body: JSON.stringify({ nome: selectedPerson.name, pin: pinBuffer })
  });
  const json = await res.json();
  if (!res.ok || !json.ok){ err.textContent = json.error || 'PIN non corretto'; pinBuffer=''; updatePinDots(); return; }
  const p = json.user;
  me = { name:p.name, email:p.email||null, role: p.role==='admin' ? 'gestore':'utente', isPin:true };
  await enterHome();
}
async function doPasswordLogin(){
  const err = document.getElementById('pw-err');
  const pass = document.getElementById('pw-input').value;
  if (!pass){ err.textContent='Inserisci la password'; return; }
  const { data, error } = await sb.auth.signInWithPassword({ email: selectedPerson.email, password: pass });
  if (error){ err.textContent = 'Password errata'; return; }
  const { data: rd } = await sb.from('user_roles').select('*').eq('email', selectedPerson.email).single();
  me = { name: rd?.name || selectedPerson.name, email: selectedPerson.email, role: rd?.role || 'utente', isPin:false };
  await enterHome();
}

async function enterHome(){
  document.getElementById('home-greet').textContent = 'Ciao ' + me.name.split(' ')[0] + ' 👋';
  await loadVehicles();
  showScreen('screen-home');
}

function goHome(){ showScreen('screen-home'); }

function logoutKiosk(){
  if (me && !me.isPin) sb.auth.signOut();
  me = null; selectedPerson = null;
  showScreen('screen-names');
  loadNames();
}

async function loadVehicles(){
  const { data } = await sb.from('vehicles').select('*').eq('active',true).eq('bookable',true).order('name');
  vehicles = data || [];
}

// ── Helper range/conflitti (stessa logica della v2 desktop) ──
const SLOT_WINDOWS = { morning:{startH:6,endH:13}, afternoon:{startH:13,endH:22}, full:{startH:0,endH:24} };
function computeRange(dateStr, slot){
  const w = SLOT_WINDOWS[slot];
  const start = new Date(dateStr+'T00:00:00'); start.setHours(w.startH,0,0,0);
  const end = new Date(dateStr+'T00:00:00');
  if (w.endH===24){ end.setDate(end.getDate()+1); end.setHours(0,0,0,0); } else end.setHours(w.endH,0,0,0);
  return {start,end};
}
function effectiveRange(bk){
  const base = (bk.start_datetime && bk.end_datetime) ? {start:new Date(bk.start_datetime), end:new Date(bk.end_datetime)} : computeRange(bk.date, bk.time_slot);
  if (bk.actual_return_datetime){
    const actual = new Date(bk.actual_return_datetime);
    if (actual < base.end) return {start:base.start, end:actual};
  }
  return base;
}
function overlap(aS,aE,bS,bE){ return aS<bE && aE>bS; }

// ── PRENOTA (flusso rapido: adesso + durata) ──────
async function openPrenotaFlow(){
  const now = new Date();
  const today = fmtDate(now);
  const { data } = await sb.from('vehicle_bookings').select('*').gte('date', fmtDate(new Date(now.getTime()-86400000))).lte('date', fmtDate(new Date(now.getTime()+86400000))).neq('status','cancelled');
  const bookings = data || [];
  const free = vehicles.filter(v => !bookings.some(b => b.vehicle_id===v.id && overlap(now, new Date(now.getTime()+60000), effectiveRange(b).start, effectiveRange(b).end)));
  const list = document.getElementById('prenota-veh-list');
  if (!free.length){ list.innerHTML = '<div style="color:#8a92a3;text-align:center">Nessun mezzo libero in questo momento</div>'; }
  else {
    list.innerHTML = free.map(v => `<div class="veh-row" onclick='pickVehicle(${v.id})'>
      <div><div class="nm">${v.name}</div><div class="sub">${v.plate||''}</div></div>
      <div class="chev">›</div></div>`).join('');
  }
  showScreen('screen-prenota-veh');
}
function pickVehicle(id){
  prenotaVeh = vehicles.find(v=>v.id===id);
  document.getElementById('dur-veh-name').textContent = '🚗 ' + prenotaVeh.name + (prenotaVeh.plate ? ' · '+prenotaVeh.plate : '');
  const opts = [ {label:'1 ora', ms:3600e3}, {label:'2 ore', ms:2*3600e3}, {label:'4 ore', ms:4*3600e3}, {label:'Resto giornata', ms:null} ];
  prenotaDurMs = opts[0].ms;
  document.getElementById('dur-options').innerHTML = opts.map((o,i)=>
    `<div class="dur-btn ${i===0?'sel':''}" data-ms="${o.ms??'EOD'}" onclick="selectDur(this,'${o.ms??'EOD'}')">${o.label}</div>`).join('');
  showScreen('screen-prenota-dur');
}
function selectDur(el,val){
  document.querySelectorAll('.dur-btn').forEach(b=>b.classList.remove('sel'));
  el.classList.add('sel');
  prenotaDurMs = val==='EOD' ? 'EOD' : parseInt(val);
}
async function confirmPrenota(){
  const now = new Date();
  const start = now;
  let end;
  if (prenotaDurMs==='EOD'){ end = new Date(now); end.setHours(23,59,0,0); }
  else end = new Date(now.getTime() + prenotaDurMs);
  const dateStr = fmtDate(now);
  const { error } = await sb.from('vehicle_bookings').insert({
    vehicle_id: prenotaVeh.id, booker_email: me.email, booker_name: me.name,
    date: dateStr, time_slot: 'custom', destination: 'Prenotazione rapida da tablet', notes: '',
    status: 'confirmed', created_by: me.name,
    start_datetime: start.toISOString(), end_datetime: end.toISOString(),
  });
  if (error){ alert('Errore: '+error.message); return; }
  document.getElementById('success-msg').textContent = '✅ ' + prenotaVeh.name + ' prenotato';
  showScreen('screen-success');
  setTimeout(()=>logoutKiosk(), 2500);
}

// ── RICONSEGNA ─────────────────────────────────────
async function openRiconsegnaFlow(){
  const now = new Date();
  const { data } = await sb.from('vehicle_bookings').select('*, vehicles(name,plate)')
    .is('actual_return_datetime', null).neq('status','cancelled').order('date',{ascending:false}).limit(200);
  let candidates = (data||[]).filter(b => effectiveRange(b).start <= now);
  if (me.role !== 'gestore') candidates = candidates.filter(b => b.booker_email ? b.booker_email===me.email : b.booker_name===me.name);
  returnCandidates = candidates;
  const list = document.getElementById('riconsegna-list');
  if (!candidates.length){ list.innerHTML = '<div style="color:#8a92a3;text-align:center">Nessun mezzo da riconsegnare</div>'; }
  else {
    list.innerHTML = candidates.map(b=>{
      const er = effectiveRange(b);
      const overdue = er.end < now;
      return `<div class="ret-row" onclick='confirmReturn(${b.id})'>
        <div><div class="nm">${b.vehicles?.name||'?'}</div><div class="sub">${b.vehicles?.plate||''} · rientro previsto ${er.end.toLocaleTimeString('it-IT',{hour:'2-digit',minute:'2-digit'})}</div></div>
        ${overdue ? '<span class="badge-late">In ritardo</span>' : '<div class="chev">›</div>'}
      </div>`;
    }).join('');
  }
  showScreen('screen-riconsegna');
}
function confirmReturn(id){
  const b = returnCandidates.find(x=>x.id===id);
  if (!confirm('Confermi la riconsegna di '+(b.vehicles?.name||'questo mezzo')+' adesso?')) return;
  doReturn(id, b.vehicles?.name);
}
async function doReturn(id, vname){
  const nowIso = new Date().toISOString();
  const { error } = await sb.from('vehicle_bookings').update({
    actual_return_datetime: nowIso, returned_by_name: me.name, returned_by_email: me.email,
  }).eq('id', id);
  if (error){ alert('Errore: '+error.message); return; }
  document.getElementById('success-msg').textContent = '✅ ' + (vname||'Mezzo') + ' riconsegnato';
  showScreen('screen-success');
  setTimeout(()=>logoutKiosk(), 2500);
}

loadNames();
</script>
